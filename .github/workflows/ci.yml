name: CI

# The convention-regression tripwire from DESIGN.md §10: `examples/demo-site` is
# the executable specification of the content conventions, so it is built on
# every push. A convention change therefore surfaces in the generator repo,
# before any content repo bumps its pinned `ref:` (D-14).

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Asia/Singapore     # "last updated" timestamps render in SGT (§6.10)

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeLaGuardo/setup-clojure@13
        with:
          bb: latest

      - name: Show versions
        run: bb --version

      # D-P3-8: the Pagefind binary is fetched, sha256-verified and cached by
      # the generator itself (`bb fetch-tool`), outside the site. The cache key
      # is the pin — version, platform and that platform's hash, read from the
      # generator so there is one place to bump it — plus the cache layout:
      # `v2` entries carry the verification stamp of §11.2 item 46, and an
      # unstamped entry restored under the old key would be re-fetched on
      # every run without ever being saved again.
      - name: Pagefind pin
        id: pagefind
        run: |
          bb -e "(require 'clogem.config 'clogem.search)
                 (let [v (get-in clogem.config/defaults [:tools :pagefind :version])
                       p (clogem.search/platform)]
                   (println (str \"key=pagefind-v2-\" v \"-\" p \"-\" (get-in clogem.search/known-sha256 [v p]))))" \
            >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Cache the tools directory
        uses: actions/cache@v4
        with:
          path: ~/.cache/clogem-press/tools
          key: ${{ steps.pagefind.outputs.key }}

      # Exported for every later step: `bb test` runs its real-binary
      # integration test only when CLOGEM_PAGEFIND is set (and fails on CI
      # when it is not), and the demo builds below use the same binary.
      - name: Fetch Pagefind and export CLOGEM_PAGEFIND
        working-directory: examples/demo-site
        run: |
          set -euo pipefail
          bin=$(bb --config ../../bb.edn fetch-tool | tail -n 1)
          test -x "$bin"
          "$bin" --version
          echo "CLOGEM_PAGEFIND=$bin" >> "$GITHUB_ENV"

      - name: Run tests
        run: bb test

      # Two builds, and the pair is the point:
      #
      #   --no-write proves the generator can run against a read-only tree and
      #   still produce stable URLs (§7.2 mechanism (c)); the `git diff` check
      #   after it proves it really did not touch a single source byte.
      - name: Build demo site (read-only)
        working-directory: examples/demo-site
        run: bb --config ../../bb.edn build --no-write --out dist-readonly

      - name: Assert the read-only build mutated nothing
        run: git diff --exit-code -- examples/demo-site

      #   The normal build exercises the auto-fill path. Because the demo tree
      #   ships already-normalized, auto-fill is a no-op and the tree must STILL
      #   be unchanged — which is loop guard 3 from §7.2 (idempotence) checked
      #   on every push rather than trusted.
      - name: Build demo site (normal, exercises auto-fill)
        working-directory: examples/demo-site
        run: bb --config ../../bb.edn build

      - name: Assert auto-fill is idempotent on an already-normalized tree
        run: git diff --exit-code -- examples/demo-site

      - name: Doctor must report no errors
        working-directory: examples/demo-site
        run: bb --config ../../bb.edn doctor

      # Cheap assertions that the five-language output shape is what §6.3
      # specifies. A test can assert on the model; only this can assert on the
      # bytes that would be uploaded.
      - name: Assert the emitted URL scheme
        working-directory: examples/demo-site
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          test -f dist/index.html                  || fail "no English home"
          for l in zh-Hans zh-Hant ms ta; do
            test -f "dist/$l/index.html"           || fail "no $l home"
          done

          # The Tamil-only article must be served at its BARE identity URL, in
          # Tamil — §6.3's per-article primary, and the case the requirement
          # explicitly allows. Asserted on the <html> element of that one page:
          # a bare `lang="ta"` grep also matched the switcher's
          # `hreflang="ta" lang="ta"`, which every page carries.
          grep -qE '<html [^>]*lang="ta"' dist/pages/171a98/index.html \
                                                   || fail "the Tamil-only article is not <html lang=\"ta\"> at its bare URL"
          if grep -qE '<html [^>]*lang="ta"' dist/pages/643259/index.html; then
            fail "an English article claims <html lang=\"ta\"> — the Tamil check above is vacuous"
          fi

          # A translated article must have prefixed non-primary variants.
          test -d dist/zh-Hant/pages               || fail "no zh-Hant variants emitted"

          # Phase 2 (D-P2-3): the three index systems, bare for the site
          # default language and under /<lang>/ for every other one.
          for k in categories tags archives; do
            test -f "dist/$k/index.html"           || fail "no /$k/ index"
            for l in zh-Hans zh-Hant ms ta; do
              test -f "dist/$l/$k/index.html"      || fail "no /$l/$k/ index"
            done
          done
          test -f dist/page/2/index.html           || fail "no homepage pagination"
          # Unicode slugs are kept verbatim in the directory name (D-P2-3)
          test -f "dist/categories/中文笔记/index.html" || fail "no CJK category page"
          test -f "dist/tags/தமிழ்/index.html"      || fail "no Tamil tag page"

          # The exporter copies; nothing in dist/ may be a symlink. Not a
          # platform constraint (upload-pages-artifact dereferences — v2.1 V15),
          # but a house rule worth enforcing: a dereferenced link ships its
          # target's full bytes against the 1 GB published-site cap.
          if find dist -type l | grep -q .; then fail "dist/ contains symlinks"; fi

          echo "URL scheme OK: $(find dist -name index.html | wc -l) pages"

      # Phase 3 (D-P3-1…4), on the root-base build: every canonical absolute
      # and self-referencing, every hreflang set reciprocal (Google ignores
      # unreciprocated annotations), a parseable Atom feed per language, a
      # parseable sitemap listing exactly the indexable pages, and robots.txt.
      - name: Assert canonical, hreflang, feeds, sitemap and robots.txt
        working-directory: examples/demo-site
        run: python3 ../../.github/scripts/check_seo.py dist https://clogem-demo.example en zh-Hans zh-Hant ms ta

      # Phase 3 exit criterion, "per-language Pagefind indexes" (D-P3-8 …
      # D-P3-10): pagefind-entry.json lists exactly the five languages, each
      # with as many pages as that language has article variants; only article
      # and catalogue pages carry data-pagefind-body (never a home); every page
      # opens <body> with <pagefind-config>, zh-Hant pages with lang="zh-TW".
      - name: Assert the per-language search indexes
        working-directory: examples/demo-site
        run: bb ../../.github/scripts/check_search.clj dist / en zh-Hans zh-Hant ms ta

      # Phase 3 exit criterion, "one giscus thread per article" (D-P3-15): for
      # every identity group (pages sharing an hreflang x-default), every
      # article variant carries exactly one giscus script with the same
      # data-term — the bare permalink — terms are distinct across groups,
      # data-lang is each page language's :giscus (ms and ta → en), and no
      # catalogue, home or index page carries one. With the hreflang check
      # and the per-language search check above, that is all of §8's Phase 3
      # exit criterion, asserted on the bytes that would be uploaded.
      - name: Assert one giscus thread per article identity
        working-directory: examples/demo-site
        run: python3 ../../.github/scripts/check_giscus.py dist / en=en zh-Hans=zh-CN zh-Hant=zh-TW ms=en ta=en

      # Only base "/" is exercised above, and that is exactly the base under
      # which stripping the base and not stripping it produce identical output
      # — so the whole class of "the base is baked into the layout" bug was
      # invisible. Build once with a non-root base and assert that `dist/` is
      # the DEPLOY ROOT rather than a directory containing one.
      - name: Build demo site with a non-root base
        working-directory: examples/demo-site
        run: bb --config ../../bb.edn build --no-write --base /clogem-demo/ --out dist-base

      - name: Assert the base is not baked into the output layout
        working-directory: examples/demo-site
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          base=/clogem-demo/

          test -f dist-base/index.html            || fail "site root is a 404: no dist-base/index.html"
          test ! -e dist-base/clogem-demo         || fail "the base is baked into the layout: dist-base/clogem-demo/ exists"
          test -f dist-base/clogem/css/theme.css  || fail "theme assets missing"
          # robots.txt only counts at the host root (D-P3-4); a project site has none
          test ! -e dist-base/robots.txt          || fail "robots.txt emitted under a non-root base"
          test -f dist-base/sitemap.xml           || fail "no sitemap.xml at the deploy root"
          test -f dist-base/zh-Hans/feed.xml      || fail "no zh-Hans feed at the deploy root"
          # Pagefind ran over this build too (D-P3-8), so the resolver below
          # also proves <base>pagefind/… resolves
          test -f dist-base/pagefind/pagefind-component-ui.js || fail "no Pagefind bundle under a non-root base"

          # The real invariant, and the one that was broken: every internal
          # link must resolve to a file once the base is stripped.
          missing=0
          hrefs=$(grep -ohE '(href|src)="/[^"]*"' -r dist-base --include='*.html' \
                  | sed -E 's/^(href|src)="//; s/"$//' | sort -u)
          for href in $hrefs; do
            # theme assets carry ?v=<fingerprint> (D-P4-7): a query, not a file
            href="${href%%[?#]*}"
            case "$href" in
              "$base"*) ;;
              *) echo "::error::link does not carry the base: $href"; missing=$((missing+1)); continue ;;
            esac
            rel="${href#$base}"
            # hrefs percent-encode path segments (D-P2-3); files are unencoded
            rel="$(printf '%b' "${rel//%/\\x}")"
            [ -f "dist-base/$rel" ] && continue
            [ -f "dist-base/${rel%/}/index.html" ] && continue
            [ -z "$rel" ] && [ -f dist-base/index.html ] && continue
            echo "::error::dangling link $href -> dist-base/$rel"
            missing=$((missing+1))
          done
          test "$missing" -eq 0 || fail "$missing internal link(s) do not resolve under a non-root base"

          echo "base layout OK: $(find dist-base -name index.html | wc -l) pages, $(echo "$hrefs" | wc -l) distinct links"

      - name: Assert the search output under a non-root base
        working-directory: examples/demo-site
        run: bb ../../.github/scripts/check_search.clj dist-base /clogem-demo/ en zh-Hans zh-Hant ms ta

      # The term must not pick up the base: /pages/xxxxxx/ under /clogem-demo/ too
      - name: Assert the giscus terms under a non-root base
        working-directory: examples/demo-site
        run: python3 ../../.github/scripts/check_giscus.py dist-base /clogem-demo/ en=en zh-Hans=zh-CN zh-Hant=zh-TW ms=en ta=en

      # §11.2 item 46: --no-search builds pages with no search UI at all. It
      # used to skip the indexer but keep linking pagefind/…, so every page of
      # this deployable output 404'd twice. The same resolver, at base "/".
      - name: Build demo site without search
        working-directory: examples/demo-site
        run: bb --config ../../bb.edn build --no-write --no-search --out dist-nosearch

      - name: Assert the --no-search build references no Pagefind and its links resolve
        working-directory: examples/demo-site
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          test ! -e dist-nosearch/pagefind       || fail "--no-search wrote a pagefind/ bundle"
          # markup, not prose: the demo's articles mention Pagefind by name
          if grep -rlE 'data-pagefind-|<pagefind-|(href|src)="[^"]*(/pagefind/|/js/search\.js)' dist-nosearch --include='*.html' \
               | head -n 3 | grep .; then
            fail "--no-search pages still carry search markup"
          fi
          missing=0
          hrefs=$(grep -ohE '(href|src)="/[^"]*"' -r dist-nosearch --include='*.html' \
                  | sed -E 's/^(href|src)="//; s/"$//' | sort -u)
          for href in $hrefs; do
            href="${href%%[?#]*}"
            rel="${href#/}"
            rel="$(printf '%b' "${rel//%/\\x}")"
            [ -f "dist-nosearch/$rel" ] && continue
            [ -f "dist-nosearch/${rel%/}/index.html" ] && continue
            [ -z "$rel" ] && [ -f dist-nosearch/index.html ] && continue
            echo "::error::dangling link $href -> dist-nosearch/$rel"
            missing=$((missing+1))
          done
          test "$missing" -eq 0 || fail "$missing internal link(s) do not resolve in the --no-search build"
          echo "--no-search OK: $(find dist-nosearch -name index.html | wc -l) pages, $(echo "$hrefs" | wc -l) distinct links"

      - name: Assert the non-root-base build mutated nothing
        run: git diff --exit-code -- examples/demo-site

      - name: Report output size
        working-directory: examples/demo-site
        run: du -sh dist
